<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c" />
      <stop offset="100%" stop-color="#070e17" />
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Squircle Base for crisp favicon display -->
  <rect width="512" height="512" rx="112" fill="url(#favBg)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#favGold)" stroke-width="8" stroke-opacity="0.5" />

  <!-- Outer Rounded Shield -->
  <path d="M 256 56 L 416 116 C 416 290 256 398 256 460 C 256 398 96 290 96 116 Z" 
        fill="#0f2238" 
        stroke="url(#favBorder)" 
        stroke-width="14" 
        stroke-linejoin="round" />

  <!-- Royal Crown -->
  <path d="M 180 180 L 196 220 L 256 195 L 316 220 L 332 180 L 306 235 L 206 235 Z" 
        fill="url(#favGold)" />
  <circle cx="180" cy="175" r="9" fill="#fde047" />
  <circle cx="256" cy="190" r="11" fill="#fde047" />
  <circle cx="332" cy="175" r="9" fill="#fde047" />

  <!-- Hostel Gable & Arch -->
  <path d="M 256 250 L 336 300 L 336 380 L 176 380 L 176 300 Z" 
        fill="#0b192c" 
        stroke="url(#favGold)" 
        stroke-width="8" 
        stroke-linejoin="round" />

  <!-- Arch Doorway -->
  <path d="M 230 380 V 325 C 230 310 282 310 282 325 V 380 Z" 
        fill="url(#favGold)" />

  <!-- Windows -->
  <rect x="195" y="315" width="20" height="24" rx="4" fill="url(#favGold)" />
  <rect x="297" y="315" width="20" height="24" rx="4" fill="url(#favGold)" />

  <!-- Subtitle Tag -->
  <text x="256" y="420" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="24" 
        font-weight="900" 
        letter-spacing="5" 
        text-anchor="middle" 
        fill="#ffffff">KHUZDAR</text>
</svg>