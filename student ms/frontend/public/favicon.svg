<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c" />
      <stop offset="100%" stop-color="#070e17" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#tealGrad)" stroke-width="8" stroke-opacity="0.6" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="220" r="160" fill="#0d9488" opacity="0.15" filter="url(#glow)" />

  <!-- Shield Crest Background -->
  <path d="M 256 96 L 392 144 V 272 C 392 352 256 424 256 424 C 256 424 120 352 120 272 V 144 Z"
        fill="#0f2238" stroke="url(#tealGrad)" stroke-width="12" stroke-linejoin="round" />

  <!-- Hostel Crown / Roofline -->
  <path d="M 200 160 L 256 120 L 312 160 L 290 190 L 256 172 L 222 190 Z"
        fill="url(#goldGrad)" stroke="#b45309" stroke-width="2" />

  <!-- Royal Hostel Monogram: RH -->
  <text x="256" y="310"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="140"
        font-weight="900"
        letter-spacing="2"
        text-anchor="middle"
        fill="#ffffff">RH</text>

  <!-- Subtitle Tag -->
  <rect x="180" y="340" width="152" height="28" rx="14" fill="url(#tealGrad)" />
  <text x="256" y="359"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="14"
        font-weight="800"
        letter-spacing="3"
        text-anchor="middle"
        fill="#070e17">KHUZDAR</text>
</svg>