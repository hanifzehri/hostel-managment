<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 130" width="100%" height="100%">
  <defs>
    <linearGradient id="fullShieldNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2238" />
      <stop offset="100%" stop-color="#070E17" />
    </linearGradient>
    <linearGradient id="fullRoyalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="fullGoldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="fullSubtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Left Emblem Group (scaled & positioned at x=65, y=65) -->
  <g transform="translate(10, 5) scale(0.6)">
    <!-- Outer Shield -->
    <path d="M 100 12 L 165 36 C 165 110 100 156 100 188 C 100 156 35 110 35 36 Z" 
          fill="url(#fullShieldNavy)" 
          stroke="url(#fullGoldBorder)" 
          stroke-width="5" 
          stroke-linejoin="round"
          filter="url(#fullSubtleShadow)" />

    <!-- Inner Shield Rim -->
    <path d="M 100 24 L 153 44 C 153 104 100 144 100 172 C 100 144 47 104 47 44 Z" 
          fill="none" 
          stroke="url(#fullRoyalGold)" 
          stroke-width="1.8" 
          stroke-dasharray="2 1" 
          opacity="0.75" />

    <!-- Crown -->
    <path d="M 72 62 L 78 78 L 100 68 L 122 78 L 128 62 L 118 84 L 82 84 Z" 
          fill="url(#fullRoyalGold)" />
    <circle cx="72" cy="60" r="3" fill="#FDE047" />
    <circle cx="100" cy="66" r="3.5" fill="#FDE047" />
    <circle cx="128" cy="60" r="3" fill="#FDE047" />

    <!-- Hostel Building Gable -->
    <path d="M 100 90 L 132 110 L 132 144 L 68 144 L 68 110 Z" 
          fill="#0B192C" 
          stroke="url(#fullRoyalGold)" 
          stroke-width="3" 
          stroke-linejoin="round" />

    <!-- Arch Doorway -->
    <path d="M 90 144 V 122 C 90 116 110 116 110 122 V 144 Z" 
          fill="url(#fullRoyalGold)" />

    <!-- Windows -->
    <rect x="76" y="116" width="8" height="10" rx="1.5" fill="url(#fullRoyalGold)" />
    <rect x="116" y="116" width="8" height="10" rx="1.5" fill="url(#fullRoyalGold)" />

    <!-- Shield Tag -->
    <text x="100" y="162" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="10" 
          font-weight="900" 
          letter-spacing="2.5" 
          text-anchor="middle" 
          fill="#FFFFFF">KHUZDAR</text>
  </g>

  <!-- Wordmark Section -->
  <g transform="translate(140, 20)">
    <!-- Primary Title -->
    <text x="0" y="44" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="0.5" 
          fill="#0B192C">ROYAL HOSTEL</text>

    <!-- Subtitle / Location -->
    <text x="2" y="76" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="14" 
          font-weight="800" 
          letter-spacing="5" 
          fill="#D97706">KHUZDAR • BALOCHISTAN</text>

    <!-- Decorative Accent Line -->
    <rect x="2" y="88" width="80" height="3" rx="1.5" fill="url(#fullRoyalGold)" />
  </g>
</svg>
